<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>科研绘图工作区</title>
  <link rel="stylesheet" href="research-chart-studio.css">
</head>
<body>
  <header class="studio-header">
    <div class="brand-block">
      <p class="eyebrow">SIMPLEEXPERIMENT</p>
      <h1>科研绘图</h1>
      <span class="runtime-badge" title="图表在本机由开源 Vega-Lite 引擎生成，不自动跳转外部网站">本地 SVG 引擎</span>
    </div>
    <div class="header-actions" role="group" aria-label="科研绘图主要操作">
      <input id="dataFileInput" type="file" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values" hidden>
      <button id="fullscreenButton" class="button secondary" type="button" aria-pressed="false" title="让科研绘图工作区占满屏幕；再次点击或按 Esc 恢复窗口"><span aria-hidden="true">&#8599;</span><span>全屏</span></button>
      <button id="loadDataButton" class="button secondary" type="button" title="导入本地 CSV、TSV 或 TXT 表格数据">导入数据</button>
      <button id="loadSampleButton" class="button secondary" type="button" title="载入内置科研示例数据">示例数据</button>
      <button id="selectSvgButton" class="button secondary" type="button" title="选择已有 SVG 文件并通过宿主安全校验">导入 SVG</button>
      <button id="insertButton" class="button primary" type="button" disabled title="将当前预览使用的同一份 SVG 插入 PowerPoint">插入 PPT</button>
    </div>
  </header>

  <main class="studio-layout">
    <aside class="control-panel" aria-label="数据与图表设置">
      <section class="control-section data-section">
        <div class="section-heading">
          <h2>数据</h2>
          <span id="dataSummary" class="section-meta">0 行 · 0 列</span>
        </div>
        <textarea id="dataEditor" rows="9" spellcheck="false" aria-label="CSV 或 TSV 数据编辑器" title="粘贴或编辑 CSV、TSV 表格数据">方法,准确率,标准差,数据集
Baseline,0.842,0.018,A
Ours,0.913,0.012,A
Baseline,0.815,0.021,B
Ours,0.887,0.015,B</textarea>
        <div class="data-actions">
          <button id="applyDataButton" class="compact-button" type="button" title="重新解析编辑器中的数据">更新数据</button>
          <button id="resetDataButton" class="compact-button quiet" type="button" title="恢复内置示例数据">恢复示例</button>
          <span id="dataSource" class="source-label">内置示例</span>
        </div>
      </section>

      <section class="control-section">
        <div class="section-heading">
          <h2>图表</h2>
          <span id="currentChartType" class="section-meta">分组柱状图</span>
        </div>
        <div id="chartTypeGrid" class="chart-type-grid" role="radiogroup" aria-label="图表类型">
          <button type="button" data-chart-type="bar" role="radio" aria-checked="false" title="按分类比较单个数值">柱状图</button>
          <button type="button" data-chart-type="groupedBar" role="radio" aria-checked="true" class="active" title="按颜色字段分组比较数值">分组柱状</button>
          <button type="button" data-chart-type="stackedBar" role="radio" aria-checked="false" title="按颜色字段堆叠比较数值">堆叠柱状</button>
          <button type="button" data-chart-type="horizontalBar" role="radio" aria-checked="false" title="横向显示分类柱状图">横向柱状</button>
          <button type="button" data-chart-type="line" role="radio" aria-checked="false" title="显示趋势与多系列折线">折线图</button>
          <button type="button" data-chart-type="area" role="radio" aria-checked="false" title="显示趋势和累计面积">面积图</button>
          <button type="button" data-chart-type="scatter" role="radio" aria-checked="false" title="显示两个数值字段的关系">散点图</button>
          <button type="button" data-chart-type="bubble" role="radio" aria-checked="false" title="用点大小显示第三个数值字段">气泡图</button>
          <button type="button" data-chart-type="histogram" role="radio" aria-checked="false" title="显示数值字段的分布">直方图</button>
          <button type="button" data-chart-type="boxplot" role="radio" aria-checked="false" title="显示分组分布与异常值">箱线图</button>
          <button type="button" data-chart-type="heatmap" role="radio" aria-checked="false" title="用颜色显示二维分类或数值矩阵">热力图</button>
          <button type="button" data-chart-type="donut" role="radio" aria-checked="false" title="显示分类占比">环形图</button>
        </div>
      </section>

      <section class="control-section">
        <div class="section-heading"><h2>字段映射</h2></div>
        <div class="field-grid">
          <label><span>X 轴</span><select id="xField" title="选择横轴或分类字段"></select></label>
          <label><span>Y 轴</span><select id="yField" title="选择纵轴数值字段"></select></label>
          <label><span>分组 / 颜色</span><select id="colorField" title="选择系列、分组或颜色字段"><option value="">不使用</option></select></label>
          <label><span>点大小</span><select id="sizeField" title="气泡图点大小字段"><option value="">不使用</option></select></label>
          <label><span>误差下限</span><select id="errorLowField" title="误差线下限字段"><option value="">不使用</option></select></label>
          <label><span>误差上限</span><select id="errorHighField" title="误差线上限字段"><option value="">不使用</option></select></label>
          <label><span>聚合</span><select id="aggregateMode" title="对重复分类进行聚合"><option value="">不聚合</option><option value="mean">平均值</option><option value="sum">求和</option><option value="median">中位数</option><option value="min">最小值</option><option value="max">最大值</option><option value="count">计数</option></select></label>
          <label><span>排序</span><select id="sortMode" title="控制分类和数值排序"><option value="none">原始顺序</option><option value="ascending">升序</option><option value="descending">降序</option></select></label>
        </div>
      </section>
    </aside>

    <section class="preview-panel" aria-label="科研绘图实时预览">
      <div class="preview-toolbar">
        <div>
          <strong id="previewTitle">分组柱状图</strong>
          <span id="previewMeta" class="muted">Vega-Lite · SVG</span>
        </div>
        <div class="preview-stats" aria-label="预览数据概况">
          <span><b id="rowCount">4</b> 行</span>
          <span><b id="columnCount">4</b> 列</span>
          <span id="renderState" class="render-state">待渲染</span>
        </div>
      </div>
      <div id="svgPreviewWrap" class="svg-preview-wrap">
        <div id="chartPreview" class="chart-preview" aria-label="Vega-Lite SVG 图表预览"></div>
        <img id="svgPreview" alt="导入的科研绘图 SVG 预览" hidden>
        <div id="emptyState" class="empty-state" hidden>暂无可预览数据</div>
      </div>
      <div id="studioStatus" class="studio-status" role="status" aria-live="polite">本地绘图引擎准备就绪</div>
    </section>

    <aside class="style-panel" aria-label="图表样式设置">
      <section class="control-section">
        <div class="section-heading"><h2>标题与坐标</h2></div>
        <div class="field-stack">
          <label><span>图表标题</span><input id="chartTitle" type="text" value="模型性能比较" title="设置图表标题"></label>
          <label><span>X 轴标题</span><input id="xAxisTitle" type="text" value="方法" title="设置横轴标题"></label>
          <label><span>Y 轴标题</span><input id="yAxisTitle" type="text" value="准确率" title="设置纵轴标题"></label>
        </div>
      </section>

      <section class="control-section">
        <div class="section-heading"><h2>坐标轴高级</h2><span class="section-meta">论文刻度</span></div>
        <div class="field-grid">
          <label><span>X 轴尺度</span><select id="xScaleType" title="选择 X 轴的线性、对数、平方根或对称对数尺度"><option value="linear">线性</option><option value="log">对数</option><option value="sqrt">平方根</option><option value="symlog">对称对数</option></select></label>
          <label><span>Y 轴尺度</span><select id="yScaleType" title="选择 Y 轴的线性、对数、平方根或对称对数尺度"><option value="linear">线性</option><option value="log">对数</option><option value="sqrt">平方根</option><option value="symlog">对称对数</option></select></label>
          <label><span>X 刻度格式</span><select id="xTickFormat" title="设置 X 轴刻度显示格式"><option value="">自动</option><option value=".2f">两位小数</option><option value=".2%">百分比</option><option value=".2s">科学缩写</option></select></label>
          <label><span>Y 刻度格式</span><select id="yTickFormat" title="设置 Y 轴刻度显示格式"><option value="">自动</option><option value=".2f">两位小数</option><option value=".2%">百分比</option><option value=".2s">科学缩写</option></select></label>
        </div>
        <div class="number-grid">
          <label><span>X 最小值</span><input id="xDomainMin" type="number" step="any" placeholder="自动" title="设置 X 轴可视范围下限"></label>
          <label><span>X 最大值</span><input id="xDomainMax" type="number" step="any" placeholder="自动" title="设置 X 轴可视范围上限"></label>
          <label><span>Y 最小值</span><input id="yDomainMin" type="number" step="any" placeholder="自动" title="设置 Y 轴可视范围下限"></label>
          <label><span>Y 最大值</span><input id="yDomainMax" type="number" step="any" placeholder="自动" title="设置 Y 轴可视范围上限"></label>
        </div>
        <div class="field-grid">
          <label class="toggle-row"><input id="xReverse" type="checkbox"><span>反转 X 轴</span></label>
          <label class="toggle-row"><input id="yReverse" type="checkbox"><span>反转 Y 轴</span></label>
        </div>
      </section>

      <section class="control-section">
        <div class="section-heading"><h2>画布与标记</h2></div>
        <div class="number-grid">
          <label><span>宽度</span><input id="chartWidth" type="number" min="360" max="1600" step="20" value="760"></label>
          <label><span>高度</span><input id="chartHeight" type="number" min="260" max="1200" step="20" value="480"></label>
          <label><span>字号</span><input id="fontSize" type="number" min="8" max="28" step="1" value="13"></label>
          <label><span>线宽</span><input id="lineWidth" type="number" min="1" max="8" step="0.5" value="2"></label>
          <label><span>点大小</span><input id="markSize" type="number" min="10" max="500" step="10" value="90"></label>
          <label><span>透明度</span><input id="markOpacity" type="number" min="0.1" max="1" step="0.1" value="0.9"></label>
        </div>
      </section>

      <section class="control-section">
        <div class="section-heading"><h2>论文标注</h2><span class="section-meta">参考与不确定性</span></div>
        <div class="field-grid">
          <label><span>X 参考线</span><input id="referenceX" type="text" placeholder="分类或数值" title="在指定 X 位置绘制参考线，可输入分类标签或数值"></label>
          <label><span>Y 参考线</span><input id="referenceY" type="number" step="any" placeholder="不显示" title="在指定 Y 数值绘制参考线"></label>
          <label><span>X 区间下限</span><input id="referenceXMin" type="number" step="any" placeholder="不显示" title="设置 X 轴参考区间下限"></label>
          <label><span>X 区间上限</span><input id="referenceXMax" type="number" step="any" placeholder="不显示" title="设置 X 轴参考区间上限"></label>
          <label><span>Y 区间下限</span><input id="referenceYMin" type="number" step="any" placeholder="不显示" title="设置 Y 轴参考区间下限"></label>
          <label><span>Y 区间上限</span><input id="referenceYMax" type="number" step="any" placeholder="不显示" title="设置 Y 轴参考区间上限"></label>
        </div>
        <div class="field-stack">
          <label><span>注释文字</span><input id="annotationText" type="text" placeholder="例如：最佳结果" title="设置图中论文注释文字"></label>
        </div>
        <div class="field-grid">
          <label><span>注释 X</span><input id="annotationX" type="text" placeholder="分类或数值" title="设置注释所在的 X 分类或数值"></label>
          <label><span>注释 Y</span><input id="annotationY" type="number" step="any" placeholder="数值" title="设置注释所在的 Y 数值"></label>
          <label><span>标注颜色</span><input id="annotationColor" type="color" value="#b42318" title="设置参考线、参考区间和注释颜色"></label>
          <label class="toggle-row"><input id="showErrorBand" type="checkbox"><span>显示误差带</span></label>
        </div>
      </section>

      <section class="control-section">
        <div class="section-heading"><h2>配色</h2></div>
        <div id="paletteList" class="palette-list" role="radiogroup" aria-label="图表配色">
          <button type="button" data-palette="simple" role="radio" aria-checked="true" class="active" title="SimpleExperiment 品牌配色"><span><i style="--swatch:#5871ef"></i><i style="--swatch:#2f9e44"></i><i style="--swatch:#7c5cbf"></i><i style="--swatch:#d97706"></i></span><b>插件配色</b></button>
          <button type="button" data-palette="academic" role="radio" aria-checked="false" title="适合论文的高对比配色"><span><i style="--swatch:#1f77b4"></i><i style="--swatch:#d62728"></i><i style="--swatch:#2ca02c"></i><i style="--swatch:#9467bd"></i></span><b>论文高对比</b></button>
          <button type="button" data-palette="colorblind" role="radio" aria-checked="false" title="色觉友好配色"><span><i style="--swatch:#0072b2"></i><i style="--swatch:#e69f00"></i><i style="--swatch:#009e73"></i><i style="--swatch:#cc79a7"></i></span><b>色觉友好</b></button>
          <button type="button" data-palette="gray" role="radio" aria-checked="false" title="黑白打印配色"><span><i style="--swatch:#111827"></i><i style="--swatch:#4b5563"></i><i style="--swatch:#9ca3af"></i><i style="--swatch:#d1d5db"></i></span><b>黑白打印</b></button>
        </div>
        <div class="color-grid">
          <label><span>背景</span><input id="backgroundColor" type="color" value="#ffffff" title="设置画布背景色"></label>
          <label><span>文字</span><input id="textColor" type="color" value="#1f2937" title="设置标题、坐标与图例文字颜色"></label>
          <label><span>坐标轴</span><input id="axisColor" type="color" value="#6b7280" title="设置坐标轴和刻度颜色"></label>
        </div>
      </section>

      <section class="control-section options-section">
        <div class="section-heading"><h2>显示</h2></div>
        <label class="toggle-row"><input id="showLegend" type="checkbox" checked><span>显示图例</span></label>
        <label class="toggle-row"><input id="showGrid" type="checkbox" checked><span>显示网格线</span></label>
        <label class="toggle-row"><input id="includeZero" type="checkbox" checked><span>数值轴包含零</span></label>
        <label class="toggle-row"><input id="showLabels" type="checkbox"><span>显示数据标签</span></label>
        <label class="toggle-row"><input id="smoothLine" type="checkbox"><span>平滑折线</span></label>
        <button id="resetStyleButton" class="compact-button full-width" type="button" title="恢复科研绘图默认样式">恢复默认样式</button>
      </section>

      <details class="external-tools">
        <summary title="仅在明确点击后使用系统浏览器打开外部工具">外部扩展工具</summary>
        <div id="websiteList" class="website-list" role="list" aria-label="可选外部科研绘图网站"></div>
      </details>
      <p class="compatibility-note">SVG 插入需要 PowerPoint 2016 或更高版本。PowerPoint 2013 可使用任务窗格原生科研绘图入口。</p>
    </aside>
  </main>

  <script src="vendor/papaparse.min.js"></script>
  <script src="vendor/vega.min.js"></script>
  <script src="vendor/vega-lite.min.js"></script>
  <script src="vendor/vega-embed.min.js"></script>
  <script type="module" src="research-chart-studio.mjs"></script>
</body>
</html>

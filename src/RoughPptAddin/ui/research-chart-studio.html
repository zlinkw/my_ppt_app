<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>科研绘图工作区</title>
  <link rel="stylesheet" href="research-chart-studio.css">
</head>
<body>
  <header class="studio-header">
    <div>
      <p class="eyebrow">SIMPLEEXPERIMENT</p>
      <h1>科研绘图工作区</h1>
    </div>
    <div class="header-actions">
      <button id="openDefaultSite" class="button secondary" type="button" title="使用系统默认浏览器打开 RAWGraphs 在线绘图工作区">打开 RAWGraphs</button>
      <button id="selectSvgButton" class="button secondary" type="button" title="选择网站导出的本地 SVG 文件并进行安全校验和预览">选择 SVG</button>
      <button id="insertButton" class="button primary" type="button" disabled title="将当前预览的同一份 SVG 插入当前 PowerPoint 幻灯片">插入 PPT</button>
    </div>
  </header>

  <main class="studio-layout">
    <aside class="site-panel" aria-label="科研绘图网站">
      <section class="control-section">
        <h2>绘图网站</h2>
        <div id="websiteList" class="website-list" role="list" aria-label="可在系统浏览器中打开的科研绘图网站"></div>
      </section>
      <section class="control-section">
        <h2>当前文件</h2>
        <div id="fileStatus" class="status" role="status">尚未选择 SVG</div>
        <dl class="file-summary">
          <div><dt>大小</dt><dd id="fileSize">-</dd></div>
          <div><dt>画布</dt><dd id="fileDimensions">-</dd></div>
        </dl>
      </section>
      <p class="compatibility-note">SVG 插入需要 PowerPoint 2016 或更高版本；旧版可继续使用右侧任务窗格的原生科研绘图入口。</p>
    </aside>

    <section class="preview-panel" aria-label="科研 SVG 预览">
      <div class="preview-toolbar">
        <strong id="previewTitle">SVG 预览</strong>
        <span id="previewMeta" class="muted">尚未选择文件</span>
      </div>
      <div id="svgPreviewWrap" class="svg-preview-wrap">
        <img id="svgPreview" alt="当前科研绘图 SVG 预览" hidden>
        <div id="emptyState" class="empty-state">尚未选择 SVG</div>
      </div>
      <div id="studioStatus" class="studio-status" role="status" aria-live="polite">就绪</div>
    </section>
  </main>

  <script type="module" src="research-chart-studio.mjs"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>科研绘图工作区</title>
  <link rel="stylesheet" href="research-chart-studio.css">
</head>
<body>
  <header class="studio-header">
    <div>
      <p class="eyebrow">SIMPLEEXPERIMENT</p>
      <h1>科研绘图工作区</h1>
    </div>
    <div class="header-actions">
      <label class="button secondary" title="选择本地 CSV 文件，文件只在本机浏览器内解析">
        <input id="csvFile" type="file" accept=".csv,text/csv">选择 CSV
      </label>
      <button id="demoButton" class="button secondary" type="button" title="加载内置示例数据，检查预览和插入流程">加载示例</button>
      <button id="insertButton" class="button primary" type="button" disabled title="将当前选中的图表类型交给 PowerPoint 原生图表渲染器">插入 PPT</button>
    </div>
  </header>

  <main class="studio-layout">
    <aside class="control-panel" aria-label="科研绘图参数">
      <section class="control-section">
        <h2>数据</h2>
        <div id="fileStatus" class="status" role="status">尚未载入 CSV</div>
        <dl class="data-summary">
          <div><dt>行数</dt><dd id="rowCount">0</dd></div>
          <div><dt>字段</dt><dd id="fieldCount">0</dd></div>
        </dl>
      </section>
      <section class="control-section">
        <h2>字段映射</h2>
        <label>横轴或标签<select id="xField"></select></label>
        <label>数值<select id="yField"></select></label>
        <label>分组（可选）<select id="seriesField"></select></label>
        <label>误差（可选）<select id="stdField"></select></label>
      </section>
      <section class="control-section">
        <h2>预览类型</h2>
        <div id="chartTypes" class="chart-types" role="listbox" aria-label="选择科研图表类型"></div>
      </section>
      <section class="control-section">
        <label>图表标题<input id="chartTitle" type="text" value="SimpleExperiment 实验结果"></label>
      </section>
      <p class="native-note">预览使用本地 Chart.js。点击“插入 PPT”后由 PowerPoint 原生对象链路绘制，仍可编辑。</p>
    </aside>

    <section class="preview-panel" aria-label="科研图表预览">
      <div class="preview-toolbar">
        <strong id="previewTitle">等待数据</strong>
        <span id="previewMeta" class="muted">导入 CSV 后可切换图表类型</span>
      </div>
      <div id="previewCanvasWrap" class="preview-canvas-wrap">
        <canvas id="chartCanvas" aria-label="科研图表预览"></canvas>
        <div id="emptyState" class="empty-state">选择 CSV 或加载示例开始</div>
      </div>
      <div id="tableWrap" class="table-wrap" hidden></div>
      <div id="studioStatus" class="studio-status" role="status" aria-live="polite">就绪</div>
    </section>
  </main>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/papaparse.min.js"></script>
  <script type="module" src="research-chart-studio.mjs"></script>
</body>
</html>
